name: Build Synology Ubuntu 22 image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - Dockerfile.ubuntu22-synology
      - rootfs/**
      - .github/workflows/build-ubuntu22-synology.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ubuntu22-synology
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backblaze-personal-wine:ubuntu22-synology
            ghcr.io/${{ github.repository_owner }}/backblaze-personal-wine:synology
          build-args: |
            DOCKER_IMAGE_VERSION=synology
            BUILD_REV=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
