name: Build Wine IOCTL test image

on:
  workflow_dispatch:
  push:
    branches: [ wine-ioctl-test ]
    paths:
      - Dockerfile.ubuntu22-synology-wine-ioctl
      - patches/wine-volume-disk-extents.patch
      - .github/workflows/build-wine-ioctl-test.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push experimental image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ubuntu22-synology-wine-ioctl
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/backblaze-personal-wine:wine-ioctl-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
